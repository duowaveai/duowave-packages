# The catalog on GitHub Pages: every push to main checks the packages, builds dist/ (node tools/build.mjs: the .vgp
# archives, previews, hashes, catalog.json and the page) and serves it at https://packages.duowave.app — the address
# every gateway release carries for good. Pages' source: GitHub Actions (Settings → Pages). Actions pinned to their
# commits; the build is Node's own modules.
#
# The signature (stage 8 of the gateway's docs/plans/plugins.md): with the catalog's key in this repository's secrets
# — PACKAGES_SECRET_KEY (the whole minisign secret key file) and PACKAGES_KEY_PASSWORD — catalog.json gets
# catalog.json.minisig beside it, checked here against packages.pub: the open keys every gateway release carries (the
# gateway's own packages.pub, the same file), the release key and the reserve, kept offline for the day the release
# key is lost or leaks. A signature by either holds, here as in the gateway, so moving to the reserve is a change of
# the secrets, not of a gateway (the gateway's docs/plans/key-rotation.md, «Ключ каталога»). Gateways with those keys
# install plugins and apps only from a signed feed. Without the secrets the feed is built unsigned, with a warning;
# minisign comes from Ubuntu's own archive, only when signing.
#
# Code only in a signed feed: the build takes plugins and apps into catalog.json only with --signed, and this job passes
# it only when the key is in the secrets — the step after the build signs, and the one after that fails the job if the
# signature does not hold, so a feed with code is never served unsigned. Without the key the build names every package
# with code it left out and builds the rest.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SIGNING: ${{ secrets.PACKAGES_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Вся история: addedAt пакета — его первый коммит (ряд «Новое» в MagicPlace шлюза).
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build
        run: |
          if [ "$SIGNING" = true ]; then
            node tools/build.mjs --signed
          else
            node tools/build.mjs
          fi
      - name: Sign the catalog
        if: env.SIGNING == 'true'
        env:
          PACKAGES_SECRET_KEY: ${{ secrets.PACKAGES_SECRET_KEY }}
          PACKAGES_KEY_PASSWORD: ${{ secrets.PACKAGES_KEY_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/packages.key"
          printf '%s\n' "$PACKAGES_SECRET_KEY" > "$key"
          # catalog.json, and reach.json beside it («где что работает»): a gateway with the catalog's keys takes
          # reach.json only with reach.json.minisig that holds, as it does the feed.
          for file in dist/catalog.json dist/reach.json; do
            [ -f "$file" ] || continue
            printf '%s\n' "$PACKAGES_KEY_PASSWORD" | minisign -S -s "$key" -m "$file" \
              -x "$file.minisig" -t "duowave catalog $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          done
          rm -f "$key"
      - name: The signature holds
        if: env.SIGNING == 'true'
        # packages.pub is minisign's .pub files one after another (`minisign -V -p` would read only the first key):
        # every line but the comments is a key, and the signature holds when one of them takes it.
        run: |
          keys=$(tr -d '\r' < packages.pub | grep -v -e '^untrusted comment:' -e '^[[:space:]]*$' || true)
          [ -n "$keys" ] || { echo "::error::packages.pub has no key"; exit 1; }
          for file in dist/catalog.json dist/reach.json; do
            [ -f "$file" ] || continue
            signed=
            for key in $keys; do
              if minisign -Vq -P "$key" -m "$file" -x "$file.minisig"; then
                echo "$file is signed by $key"
                signed=yes
                break
              fi
            done
            [ -n "$signed" ] || { echo "::error::$file.minisig matches no key of packages.pub"; exit 1; }
          done
      - name: Unsigned
        if: env.SIGNING != 'true'
        run: >-
          echo "::warning::no PACKAGES_SECRET_KEY in the secrets: catalog.json is unsigned, so the build left out every
          plugin and app, and gateways with the catalog's keys install no code from it"
      # The station's one-line install (tools/station.sh): the gateway's latest station.sh and the station build it
      # names, put on the site once the build's signature holds against gateway-updates.pub and its version and checksum
      # match the script. The station takes them over plain HTTP (its busybox has no TLS) from get.duowave.app, a
      # Cloudflare Worker in front of this site (the gateway's scripts/release/cloudflare); this site stays HTTPS only.
      # A gateway release reaches the site at the next run: station-watch.yml starts one within the hour of a release
      # whose station.sh names another version than the site serves (by hand: Actions → pages → Run workflow).
      - name: The station's one-line install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v minisign >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends minisign; }
          sh tools/station.sh dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
