<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>YouTube — кнопка «играть» и звук</title>
  <!-- Свой знак, не значок YouTube: круглая кнопка «играть» и волны звука. Малиново-красный тон. Сплошные заливки;
       у обводок явное stroke-opacity="1". -->
  <rect width="512" height="512" fill="#E2455A"/>
  <circle cx="230" cy="270" r="230" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="230" cy="270" r="160" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- волны звука справа -->
  <path d="M388 196 A100 100 0 0 1 388 344" fill="none" stroke="#FFD3D9" stroke-opacity="1" stroke-width="28" stroke-linecap="round"/>
  <path d="M432 150 A170 170 0 0 1 432 390" fill="none" stroke="#FFE9EC" stroke-opacity="1" stroke-width="28" stroke-linecap="round"/>
  <!-- кнопка: тень, круг, треугольник -->
  <circle cx="232" cy="296" r="136" fill="#7A1426" fill-opacity="0.35"/>
  <circle cx="232" cy="274" r="136" fill="#FFFFFF"/>
  <path d="M196 212 L196 336 L304 274 Z" fill="#E2455A" stroke="#E2455A" stroke-opacity="1" stroke-width="20" stroke-linejoin="round"/>
</svg>
