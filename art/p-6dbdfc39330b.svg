<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Артур — ИИ-дворецкий</title>
  <!-- фон: цвет персонажа и мягкий ореол -->
  <rect width="512" height="512" fill="#7A8CA5"/>
  <circle cx="256" cy="236" r="196" fill="#FFFFFF" fill-opacity="0.13"/>
  <circle cx="256" cy="236" r="150" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- фрак -->
  <path d="M84 512 C 92 430, 160 384, 256 380 C 352 384, 420 430, 428 512 Z" fill="#232838"/>
  <!-- манишка -->
  <path d="M206 382 L256 476 L306 382 Z" fill="#F7F4EE"/>
  <!-- лацканы -->
  <path d="M206 382 L256 476 L232 512 L196 512 C 190 460, 186 420, 206 382 Z" fill="#2F364A"/>
  <path d="M306 382 L256 476 L280 512 L316 512 C 322 460, 326 420, 306 382 Z" fill="#2F364A"/>
  <!-- шея -->
  <path d="M224 318 L288 318 L292 392 L220 392 Z" fill="#E3B48F"/>
