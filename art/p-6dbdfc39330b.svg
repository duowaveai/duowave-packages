  <path d="M256 404 L218 386 L218 422 Z" fill="#15181F"/>
  <path d="M256 404 L294 386 L294 422 Z" fill="#15181F"/>
  <rect x="246" y="394" width="20" height="20" rx="5" fill="#0C0E13"/>
  <!-- значок на лацкане: «ИИ» без букв — точка и кольцо -->
  <circle cx="338" cy="452" r="15" fill="none" stroke="#D6E6FF" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="338" cy="452" r="7" fill="#D6E6FF"/>

  <!-- уши -->
  <ellipse cx="172" cy="262" rx="16" ry="22" fill="#E6B893"/>
  <ellipse cx="340" cy="262" rx="16" ry="22" fill="#E6B893"/>
  <!-- голова -->
  <ellipse cx="256" cy="250" rx="84" ry="100" fill="#F1CBA8"/>
  <!-- волосы: гладкий пробор -->
  <path d="M172 244 C 164 168, 206 132, 258 132 C 314 132, 352 168, 342 242 C 336 214, 324 192, 300 180 C 268 190, 222 192, 190 206 C 180 216, 174 230, 172 244 Z" fill="#3A3F4B"/>
  <path d="M226 140 C 238 156, 246 170, 252 186" fill="none" stroke="#5B6272" stroke-opacity="1" stroke-width="4" stroke-linecap="round"/>
  <!-- седые виски -->
  <path d="M172 244 C 172 228, 176 216, 184 208 C 182 222, 180 236, 180 252 Z" fill="#9CA3B0"/>
  <path d="M342 242 C 342 226, 338 214, 330 204 C 334 220, 336 236, 334 252 Z" fill="#9CA3B0"/>
