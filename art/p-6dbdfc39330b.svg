  <path d="M204 230 C 214 222, 234 222, 244 228 L 242 234 C 232 230, 216 230, 206 236 Z" fill="#3A3F4B"/>
  <path d="M268 222 C 280 210, 302 208, 314 216 L 312 222 C 300 218, 284 220, 270 228 Z" fill="#3A3F4B"/>
  <!-- глаза -->
  <ellipse cx="224" cy="256" rx="7" ry="8" fill="#1F2430"/>
  <ellipse cx="290" cy="254" rx="7" ry="8" fill="#1F2430"/>
  <!-- монокль -->
  <circle cx="290" cy="254" r="21" fill="#FFFFFF" fill-opacity="0.16" stroke="#D9B85C" stroke-opacity="1" stroke-width="5"/>
  <path d="M308 266 C 330 296, 334 340, 324 384" fill="none" stroke="#D9B85C" stroke-opacity="1" stroke-width="3" stroke-linecap="round"/>
  <!-- нос -->
  <path d="M256 262 C 252 280, 247 292, 244 298 C 250 303, 263 303, 270 298 C 264 290, 260 278, 256 262 Z" fill="#E0AE89"/>
  <!-- усы -->
  <path d="M220 318 C 234 304, 250 306, 256 313 C 262 306, 278 304, 292 318 C 278 315, 266 319, 256 322 C 246 319, 234 315, 220 318 Z" fill="#3A3F4B"/>
  <!-- сдержанная улыбка -->
  <path d="M240 336 Q 256 342 274 332" fill="none" stroke="#9A5B4A" stroke-opacity="1" stroke-width="4" stroke-linecap="round"/>
</svg>
