<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AirPlay — колонка, которая принимает звук</title>
  <!-- Свой знак, не значок Apple: колонка-шайба и волны над ней. Цвета — фиолетовый тон значков пульта
       (panel/src/ui/desk.css, .app-icon.is-violet). Сплошные заливки: ImageMagick (MSVG) не рисует градиенты. -->
  <!-- фон и мягкий ореол -->
  <rect width="512" height="512" fill="#7A6CF0"/>
  <circle cx="256" cy="300" r="230" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="256" cy="300" r="160" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- волны: дуги вокруг верха колонки (256, 356), бледнее наружу -->
  <path d="M100 208 A216 216 0 0 1 412 208" fill="none" stroke="#C9C0FF" stroke-opacity="1" stroke-width="30" stroke-linecap="round"/>
  <path d="M148 252 A150 150 0 0 1 364 252" fill="none" stroke="#E4DFFF" stroke-opacity="1" stroke-width="30" stroke-linecap="round"/>
  <path d="M196 296 A84 84 0 0 1 316 296" fill="none" stroke="#FFFFFF" stroke-opacity="1" stroke-width="30" stroke-linecap="round"/>

  <!-- колонка: тень, шайба, светящееся кольцо -->
  <ellipse cx="256" cy="410" rx="112" ry="22" fill="#2B3448" fill-opacity="0.35"/>
  <rect x="152" y="344" width="208" height="62" rx="31" ry="31" fill="#FFFFFF"/>
  <rect x="152" y="380" width="208" height="26" rx="13" ry="13" fill="#E4DFFF"/>
  <rect x="190" y="358" width="132" height="10" rx="5" ry="5" fill="#8B7CFF"/>
</svg>
