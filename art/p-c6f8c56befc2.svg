<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Ковчег — бортовой компьютер</title>
  <!-- фон: цвет персонажа и мягкий ореол -->
  <rect width="512" height="512" fill="#2E8C87"/>
  <circle cx="256" cy="236" r="196" fill="#FFFFFF" fill-opacity="0.11"/>
  <circle cx="256" cy="236" r="150" fill="#FFFFFF" fill-opacity="0.06"/>
  <!-- звёзды -->
  <circle cx="92" cy="96" r="3" fill="#DFFBF6" fill-opacity="0.8"/>
  <circle cx="420" cy="74" r="2.5" fill="#DFFBF6" fill-opacity="0.7"/>
  <circle cx="446" cy="168" r="2" fill="#DFFBF6" fill-opacity="0.6"/>
  <circle cx="62" cy="214" r="2" fill="#DFFBF6" fill-opacity="0.6"/>
  <circle cx="132" cy="58" r="2" fill="#DFFBF6" fill-opacity="0.5"/>

  <!-- орбита за пультом -->
  <ellipse cx="256" cy="252" rx="214" ry="62" fill="none" stroke="#C9F4EC" stroke-opacity="0.45" stroke-width="4"/>
  <circle cx="441" cy="221" r="10" fill="#F2C14E"/>

  <!-- корпус-ковчег под пультом -->
  <path d="M120 400 L392 400 L356 452 C 300 470, 212 470, 156 452 Z" fill="#123130"/>
  <path d="M120 400 L392 400 L384 412 L128 412 Z" fill="#1C4644"/>
  <circle cx="200" cy="432" r="8" fill="#8FF5E6" fill-opacity="0.75"/>
  <circle cx="256" cy="436" r="8" fill="#8FF5E6" fill-opacity="0.75"/>
  <circle cx="312" cy="432" r="8" fill="#8FF5E6" fill-opacity="0.75"/>
  <!-- стойка -->
  <path d="M232 372 L280 372 L288 400 L224 400 Z" fill="#0E2726"/>

  <!-- пульт -->
  <rect x="112" y="112" width="288" height="268" rx="72" fill="#123130"/>
  <rect x="134" y="134" width="244" height="224" rx="54" fill="#0A1C1C"/>
  <!-- блик стекла -->
  <path d="M158 178 C 168 156, 190 146, 214 144" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6" stroke-linecap="round"/>

  <!-- спокойный, чуть прикрытый «взгляд» -->
  <path d="M164 248 C 206 226, 306 226, 348 248 C 306 284, 206 284, 164 248 Z" fill="#103E3B"/>
  <circle cx="256" cy="252" r="44" fill="#8FF5E6" fill-opacity="0.12"/>
  <rect x="222" y="242" width="68" height="20" rx="10" fill="#8FF5E6"/>
  <rect x="244" y="248" width="24" height="8" rx="4" fill="#E9FFFB"/>
  <!-- верхнее «веко» -->
  <path d="M160 238 C 206 220, 306 220, 352 238" fill="none" stroke="#2C6E69" stroke-opacity="1" stroke-width="6" stroke-linecap="round"/>

  <!-- индикаторы состояния -->
  <circle cx="226" cy="314" r="7" fill="#8FF5E6"/>
  <circle cx="256" cy="314" r="7" fill="#8FF5E6" fill-opacity="0.45"/>
  <circle cx="286" cy="314" r="7" fill="#F2C14E"/>
  <!-- строка-волна -->
  <polyline points="186,180 214,180 224,170 234,190 244,174 254,186 264,178 272,180 326,180" fill="none" stroke="#8FF5E6" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
