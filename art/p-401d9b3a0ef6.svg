  <path d="M212 390 L256 470 L246 512 L200 512 C 194 462, 192 420, 212 390 Z" fill="#8C6A4D"/>
  <path d="M300 390 L256 470 L266 512 L312 512 C 318 462, 320 420, 300 390 Z" fill="#8C6A4D"/>
