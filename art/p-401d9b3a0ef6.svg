  <path d="M166 222 C 162 160, 214 128, 262 128 C 316 130, 354 162, 350 216 C 300 200, 220 200, 166 222 Z" fill="#8A6A45"/>
  <path d="M190 170 C 220 152, 296 150, 330 168" fill="none" stroke="#7A5C3B" stroke-opacity="1" stroke-width="4" stroke-linecap="round"/>
  <path d="M174 196 C 220 178, 300 178, 342 192" fill="none" stroke="#7A5C3B" stroke-opacity="1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="258" cy="132" r="8" fill="#6E5236"/>
  <!-- козырёк -->
  <path d="M150 228 C 196 200, 318 196, 372 222 C 362 240, 304 236, 258 236 C 212 238, 176 246, 150 228 Z" fill="#5E4430"/>

