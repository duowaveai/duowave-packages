<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Палыч — дед-ворчун</title>
  <!-- фон: цвет персонажа и мягкий ореол -->
  <rect width="512" height="512" fill="#77894F"/>
  <circle cx="256" cy="236" r="196" fill="#FFFFFF" fill-opacity="0.13"/>
  <circle cx="256" cy="236" r="150" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- вязаная кофта -->
  <path d="M80 512 C 90 432, 160 390, 256 386 C 352 390, 422 432, 432 512 Z" fill="#7B5A40"/>
  <!-- рубашка в вырезе -->
  <path d="M212 390 L256 470 L300 390 Z" fill="#D8CDB6"/>
  <path d="M234 390 L256 430 L278 390 Z" fill="#C2B59A"/>
