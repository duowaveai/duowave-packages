  <path d="M214 250 C 236 244, 276 244, 298 250" fill="none" stroke="#D29F7C" stroke-opacity="1" stroke-width="3" stroke-linecap="round"/>
  <!-- кустистые брови, сведённые к переносице -->
  <path d="M180 254 C 186 228, 226 226, 252 262 C 238 256, 222 255, 204 260 C 194 263, 184 262, 180 254 Z" fill="#F4F1EA"/>
  <path d="M332 254 C 326 228, 286 226, 260 262 C 274 256, 290 255, 308 260 C 318 263, 328 262, 332 254 Z" fill="#F4F1EA"/>
  <!-- глаза: прищур -->
  <ellipse cx="222" cy="286" rx="7" ry="5" fill="#2A2522"/>
  <ellipse cx="290" cy="286" rx="7" ry="5" fill="#2A2522"/>
  <!-- круглые очки -->
  <circle cx="222" cy="286" r="27" fill="#FFFFFF" fill-opacity="0.14" stroke="#2E2A26" stroke-opacity="1" stroke-width="5"/>
  <circle cx="290" cy="286" r="27" fill="#FFFFFF" fill-opacity="0.14" stroke="#2E2A26" stroke-opacity="1" stroke-width="5"/>
  <path d="M249 284 C 252 278, 260 278, 263 284" fill="none" stroke="#2E2A26" stroke-opacity="1" stroke-width="5" stroke-linecap="round"/>
  <path d="M195 282 L170 276 M317 282 L342 276" fill="none" stroke="#2E2A26" stroke-opacity="1" stroke-width="4" stroke-linecap="round"/>
  <!-- нос картошкой -->
  <ellipse cx="256" cy="318" rx="20" ry="17" fill="#E4A585"/>
  <!-- пышные усы -->
  <path d="M256 330 C 236 320, 200 324, 186 356 C 198 350, 214 352, 224 360 C 236 350, 248 348, 256 350 C 264 348, 276 350, 288 360 C 298 352, 314 350, 326 356 C 312 324, 276 320, 256 330 Z" fill="#F4F1EA"/>
